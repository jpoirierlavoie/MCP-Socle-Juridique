name: ci

# Contrôles sans réseau ni secret : type-check, mise en forme, tests sous workerd.
# Le socle est une bibliothèque : il n'y a ni `wrangler types` ni `wrangler deploy
# --dry-run` ici, contrairement aux deux connecteurs qui le consomment.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Mise en forme et lint
        run: npx biome check .

      - name: Tests
        run: npx vitest run
